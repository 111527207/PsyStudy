  assoc:"通常因焦慮憂鬱症狀求治療而非人格障礙症本身；壓力下可能有短暫精神病發作；某些案例發展出短暫精神病症、類思覺失調症、妄想症或思覺失調症；超過一半有至少一次重鬱發作病史；住院情況30%-50%同時有重鬱症診斷。常共病孤僻型、妄想型、畏避型、邊緣型人格障礙症。",
  prevalence:"社區樣本盛行率0.6%(挪威)至4.6%(全美)；臨床族群較不常見(0%-1.9%)；NESARC最高預估3.9%。",
  course:"相對穩定病程，只有少部分發展成思覺失調症或另一精神病症。童年或青春期可能初次表現孤獨、不良同儕關係、社交焦慮、學業低成就、過度敏感、古怪思想語言及奇怪幻想。",
  risk:"基因和生理：傾向家族聚集，更盛行於思覺失調症個案的直系親屬；血親中思覺失調症或其他精神病症可能輕微增加。",

  gender:"稍常見於<b>男性</b>診斷。",
  ddx:[

    ["身體病況引起的人格改變／物質使用障礙症","同上述鑑別邏輯。"],
    ["其他人格障礙症","社交疏離情感侷限在妄想型和孤僻型都常見，思覺失調型可藉<b>認知知覺扭曲+顯著乖僻古怪</b>來區分；親密關係在思覺失調型和畏避型都少見，但孤僻型對關係有<b>參與欲求卻被拒絕恐懼限制</b>，思覺失調型是<b>缺乏欲求</b>而持續疏離；自戀型有時表現懷疑退縮源於怕洩漏不完美；邊緣型可能有短暫精神病樣症狀，但<b>與情感轉換(強烈憤怒焦慮失望)較緊密相關且較多解離性質(失現實感失自我感)</b>，思覺失調型則<b>較可能持久且不總是與情感症狀有關</b>；雖社交孤立可能發生在邊緣型，但通常次發於人際失敗引起的憤怒爆發，非持續缺乏社交欲求；思覺失調型不常表現邊緣型的衝動操弄行為（但兩者高比率共病使區分經常行不通）。"]

  features:"漠視侵犯他人權益的廣泛模式，始於孩童或青春期早期，持續至成年（又稱心理病態psychopathy、沒良心sociopathy）。診斷須年滿18歲+15歲前有行為規範障礙症病史。欺騙操弄是中心特質；漠視社會規範，重複招致逮捕的行為；衝動決定無深謀遠慮；易怒攻擊性重複鬥毆；魯莽（超速、中毒駕駛、危險性行為）；一貫不負責任（失業、拖欠債務、未撫養子女）；對後果很少悔恨，責怪受害者或表示漠不關心。",
  assoc:"常缺乏同理心，冷酷無情嘲諷輕蔑；<b>膨脹傲慢的自我評價</b>；花言巧語表淺魅力，能言善辯（傳統「心理病態」特質，在司法場合特別有助鑑定慣犯）；性關係不負責/多伴侶；為人父母不負責；可能不光榮退伍、貧窮無家可歸、刑事監禁；比一般人較可能過早死於激烈方式（自殺意外被殺）；常抱怨緊張無法忍受無聊憂鬱心情；可能共病焦慮症、憂鬱症、物質使用障礙症、身體症狀障礙症、嗜賭症及其他衝動控制障礙症；也常符合邊緣型、做作型及自戀型PD準則。10歲前行為規範障礙症發病+共病ADHD會增加成年反社會型人格障礙症機會；兒時受虐疏忽、不穩定或不一致父母教養方式也增加轉變機會。",
  prevalence:"12個月盛行率0.2%-3.3%（DSM之前準則）。最高盛行率(&gt;70%)在男性酒精使用障礙症樣本、物質濫用門診、監獄司法場所；不利社經或社會文化因子影響的樣本也有最高盛行率。",
  course:"病程緩慢，隨年長變得較不顯著或緩解（尤其40歲後），特別明顯於犯罪行為，但全類群反社會行為與物質使用都可能減少。定義上不得於18歲前診斷。",
  risk:"基因和生理：更常見於一等血親；女性個案的血親比男性個案血親有更高危險性；血親也有更高身體症狀障礙症與物質使用障礙症危險（家族男性成員常罹患ASPD+物質使用障礙症，女性成員常罹患身體症狀障礙症）。收養研究顯示基因與環境因素皆有影響，養父母/親生父母有ASPD的孩童發展危險性增加，被收養孩童比起養父母更像親生父母，但收養家庭環境也會影響危險。",
  culture:"似乎與低社經地位與城市環境有關聯；診斷疑慮增加，有時誤用在維護生存策略的看似反社會行為；評估須考慮社會經濟背景。",
  gender:"男性比女性較常被診斷；女性可能有診斷低估疑慮（因行為規範障礙症定義強調攻擊性項目）。",
  ddx:[
    ["行為規範障礙症","18歲以下不可診斷ASPD（除非15歲前曾有CD病史）；18歲以上僅在不符合ASPD時才診斷CD。"],
    ["物質使用障礙症","伴隨SUD時，除非孩童期即有ASPD徵候並延續至成年，否則不宜診斷ASPD；若SUD與反社會行為皆始於孩童並延續成年，準則皆符合時兩診斷都可成立（即使某些反社會行為是SUD後果）。"],
    ["思覺失調症與雙相情緒障礙症","若反社會行為僅發生於這些疾病發作病程，不應診斷ASPD。"],
    ["其他人格障礙症","與自戀型都有鐵石心腸、能言善道、表淺、利用他人、缺乏同理心，但<b>自戀型不包括衝動攻擊詐欺</b>，且ASPD可能不如自戀型需要他人讚美羨慕，自戀型通常無孩童期CD或成年犯罪；與做作型都傾向衝動表淺尋求刺激魯莽性誘惑操弄，但做作型<b>誇大情緒而不從事典型反社會行為</b>；與做作型/邊緣型都會操弄他人，但ASPD是<b>為取得利益權力物質滿足</b>，做作型/邊緣型是<b>為獲取關愛</b>；比邊緣型<b>情緒較穩定而更具侵略性</b>；妄想型也可能有反社會行為，但動機常為<b>報復</b>而非個人利益剝削。"],

{
  group:"B群（戲劇化／情緒化）",
  id:"borderline", name:"邊緣型人格障礙症", en:"Borderline Personality Disorder", code:"301.83 (F60.3)",
  criteria:[
    "自成年期早期開始，一種廣泛的模式，<b>人際關係、自我形象和情感不穩定</b>，以及顯著的<b>衝動性</b>，表現符合以下五項（或更多）：①瘋狂地努力逃避真實或想像中的被拋棄(不含準則5) ②不穩定且強烈的人際關係模式(理想化與貶抑間轉換) ③認同障礙：顯著持續不穩定的自我形象或自我感 ④至少兩方面潛在自我傷害的衝動行為(如過度花費/性虐待/物質濫用/危險駕駛/嗜食，不含準則5) ⑤一再的自殺行為、姿態、威脅或自殘行為 ⑥情感不穩定(明顯反應過度的情緒，如陣發性不悅/易怒/焦慮，通常持續數小時很少超過數天) ⑦慢性空虛感 ⑧不適當且強烈的憤怒或難以控制(常發脾氣/總是發怒/一再肢體衝突) ⑨短暫、與壓力相關的妄想意念或嚴重解離症狀。"
  ],
  features:"人際關係、自體形象與情感不穩定+顯著衝動的廣泛模式。瘋狂逃避真實或想像的被拋棄——對短暫分離或計畫改變產生強烈恐懼與不合宜憤怒；不穩定強烈人際關係——快速由理想化轉為貶抑；認同障礙——自體形象突然戲劇化轉變（目標、價值、事業、性別認同）；至少兩方面潛在自傷衝動行為；一再自殺/自殘行為（<b>8-10%自殺身亡</b>，自傷及自殺威脅企圖很常見，重複自殺是常見求醫原因）；情感不穩定——陣發性不悅易怒焦慮通常數小時很少超過數天；慢性空虛感；不適當強烈憤怒難以控制；壓力下短暫妄想意念或解離症狀（一般嚴重度或總時期不足以下額外診斷）。",
  assoc:"目標即將實現前自我毀壞的模式（如畢業前退學）；壓力下可能發展精神病樣症狀；可能對過渡性客體感到比人際關係更安全；常自殺早死（尤共病憂鬱症/物質使用障礙症）；自殘或失敗自殺嘗試常致身體殘障；一再失業/學業中斷/分居離婚；童年常遭遇身體性虐待、疏於照顧、敵意衝突、早年失去父母。常共病憂鬱症/雙相、物質使用障礙症、飲食障礙症(尤暴食症)、PTSD、ADHD；也常與其他人格障礙症共同發生。",
  prevalence:"平均盛行率估計1.6%，可能高達5.9%。初級醫療環境6%，精神科門診約10%，精神科住院病患約20%。年老族群盛行率可能下降。",
  course:"病程變異很大。最常見模式：始於成年早期的長期不穩定，伴多次嚴重情緒與衝動性失控，常使用醫療心理健康服務。<b>功能減損和自殺風險在成人早期最嚴重，隨年歲增長逐漸減少</b>。強烈情緒衝動關係緊張常持續終身，但參與治療性介入常於第一年即有改善；30-40歲時大部分人際職業功能較穩定。追蹤研究顯示10年後多達半數不再符合全部準則。",
  risk:"基因和生理：一等血親有五倍機會發生此障礙症；高家族風險有物質使用障礙症、反社會型人格障礙症、憂鬱症或雙相情緒障礙症。",
  culture:"行為模式已於世界各地醫療機構確立；有認同問題的青少年年輕成人（尤伴隨物質使用）可能短暫出現被誤認為BPD的行為（情緒不穩定、存在意識困境、性取向衝突、事業社會壓力）。",
  gender:"主要是<b>女性</b>(75%)。",
  suicide:"個案中<b>8-10%自殺身亡</b>，自傷行為（割傷/自焚）及自殺威脅企圖很常見，重複自殺是常見求醫原因；自殘常被分離拒絕威脅或預期承擔更多責任促發，有時發生於解離經驗之時。",
  ddx:[
    ["憂鬱症與雙相情緒障礙症","常共同發生，若準則都符合可同時成立；橫斷式表現可能相似發作，臨床工作者應避免僅因橫斷式表現診斷BPD卻未注意早期發作與長期病程的行為模式。"],
    ["其他人格障礙症","與做作型都有尋求注意/操弄行為/情緒快速轉換，但BPD有<b>自我傷害、憤怒破壞親近關係及長期極度空虛寂寞</b>；與思覺失調型都可能出現被害意念或錯覺，但BPD的症狀<b>較短暫、因人際互動出現、對外來影響有回應</b>；妄想型與自戀型也對微小刺激憤怒，但<b>有較穩定自體形象，相對缺乏自傷衝動行為及被拋棄擔憂</b>；與反社會型都有操弄行為，但反社會型<b>為取得利益權力物質滿足</b>，BPD<b>為得到照護者關心</b>；與依賴型都害怕被拋棄，但BPD反應是<b>情緒空虛暴怒多需求</b>，依賴型是<b>更加讓步順從，急於尋求替代關係</b>；BPD可進一步以<b>典型不穩定緊張的人際關係</b>與依賴型鑑別。"],
    ["身體病況引起的人格改變／物質使用障礙症","同上述鑑別邏輯。"],
    ["認同問題","須與發展階段(如青春期)有關的認同擔憂辨別，這保留給發展階段而非精神疾病。"]

{

const tabbar = document.getElementById('tabbar');
const content = document.getElementById('content');
let lastGroup = "";
disorders.forEach((d,i)=>{
  if(d.group !== lastGroup){
    const label = document.createElement('span');
    label.className = 'grp-label';
    label.textContent = '── ' + d.group + ' ──';
    tabbar.appendChild(label);
    lastGroup = d.group;
  }
  const btn=document.createElement('button');
  btn.textContent=d.name;
  btn.onclick=()=>show(i);
  btn.id='tab-'+d.id;
  tabbar.appendChild(btn);
});
const compareBtn=document.createElement('button');
compareBtn.textContent='★ 綜合比較表';
compareBtn.id='tab-compare';
compareBtn.onclick=()=>showCompare();
tabbar.appendChild(compareBtn);

function fieldBlock(title,text){
  if(!text) return '';
  return `<h3>${title}</h3><div>${text}</div>`;
}
function ddxBlock(list){
  if(!list) return '';
  let html = '<h3>鑑別診斷 (Differential Diagnosis) ★</h3>';
  list.forEach(([name,text])=>{
    html += `<div class="ddx-item"><b>${name}：</b>${text}</div>`;
  });
  return html;
}

function renderDisorder(d){
  let html = `<h2 class="dx-title">${d.name} <span class="small">${d.en}</span></h2>`;
  html += `<div class="code">診斷碼：${d.code}</div>`;
  html += `<h3>診斷準則 (Diagnostic Criteria) ★★</h3>`;
  html += `<div class="crit-box"><ul>${d.criteria.map(c=>`<li>${c}</li>`).join('')}</ul></div>`;
  if(d.specifiers){
    html += `<h3>特別註明 (Specifiers)</h3><div class="note"><ul>${d.specifiers.map(s=>`<li>${s}</li>`).join('')}</ul></div>`;
  }
  html += fieldBlock('診斷特質 (Diagnostic Features)', d.features);
  html += fieldBlock('支持診斷相關特質 (Associated Features)', d.assoc);
  html += fieldBlock('盛行率 (Prevalence)', d.prevalence);
  html += fieldBlock('發展和病程 (Development and Course)', d.course);
  html += fieldBlock('風險和預後因子 (Risk and Prognostic Factors)', d.risk);
  html += fieldBlock('性別相關診斷議題 (Gender-Related)', d.gender);
  html += fieldBlock('文化相關診斷議題 (Culture-Related)', d.culture);
  html += fieldBlock('自殺風險 (Suicide Risk)', d.suicide);
  html += fieldBlock('功能性後果 (Functional Consequences)', d.functional);
  html += ddxBlock(d.ddx);
  html += fieldBlock('共病 (Comorbidity)', d.comorbid);
  return html;
}

function show(i){
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+disorders[i].id).classList.add('active');
  const section=document.createElement('section');
  section.className='active';
  section.innerHTML = renderDisorder(disorders[i]);
  content.innerHTML='';
  content.appendChild(section);
  window.scrollTo({top:0,behavior:'smooth'});
}

  <h3>本章共同主軸（整章導言重點）</h3>
  <ul>
  <li>一般人格障礙症準則是所有10種特定PD的<span class="compare-highlight">共同骨架</span>：內在經驗與行為的持久模式，顯著偏離文化期待，表現於認知/情感/人際功能/衝動控制中至少兩項；無彈性且遍佈廣泛；造成臨床顯著苦惱或功能減損；穩定持久且發作可追溯至青春期或成年早期；無法以另一精神疾病或物質/身體病況的生理效應更好解釋。</li>
  <li>三群人格障礙症的分群基於<span class="compare-highlight">描述學相似性</span>：<b>A群</b>（妄想型、孤僻型、思覺失調型）顯得古怪乖僻；<b>B群</b>（反社會型、邊緣型、做作型、自戀型）顯得戲劇化情緒化反覆無常；<b>C群</b>（畏避型、依賴型、強迫型）顯得焦慮恐懼。此分群系統在研究教育上有用，但有嚴重限制性且不是一貫有效——<b>個案經常同時出現不同群的人格障礙症</b>。</li>
  <li>幾乎<b>每一種PD的鑑別診斷都重複出現同一組排除項目</b>：①與精神病症的關係（若PD準則在思覺失調症等精神病症發作前已符合，加註「病前」；A群三型PD尤其須與相應精神病症鑑別）②<b>身體病況引起的人格改變</b>（特質可歸因於身體病況對中樞神經系統的效應）③<b>物質使用障礙症</b>（須與持續物質使用相關症狀區分）④與其他人格障礙症的重疊——若個案除主診斷外，人格特質也符合其他PD準則，<b>都可以被診斷（人格障礙症允許共病）</b>。</li>
  <li>層面概念(Dimensional Models)：DSM-5使用的是<b>類別觀點</b>（人格障礙症是本質不同的臨床症候群），但也存在<b>層面觀點</b>（PD代表適應不良人格特質的變異型，融合成常態），第三篇提供完整的層面概念描述。</li>
  <li>性別分布模式：<b>反社會型、思覺失調型、孤僻型、妄想型、強迫型</b>男性較常見或較常被診斷；<b>邊緣型（75%女性）、做作型、依賴型</b>女性較常被診斷；<b>畏避型</b>男女相仿。臨床醫師須注意勿因社會刻板印象而過度診斷或低估診斷。</li>
  </ul>
