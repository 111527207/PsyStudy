  id:"lbd", name:"路易氏體認知障礙症或輕型路易氏體認知障礙症", en:"NCD With Lewy Bodies", code:"很可能331.82(G31.83)+294.11/294.10；可能331.9；輕型331.83",

    "C. 符合很可能/可能有路易氏體認知障礙症的<b>核心特徵</b>和<b>次要特徵</b>：<br>核心：①認知波動合併顯著注意力和警覺力改變 ②清楚而具體視幻覺反覆發生 ③認知退化進展後發生自發性巴金森氏症特徵<br>次要：①符合快速動眼睡眠障礙 ②嚴重抗精神病藥物敏感度<br><b>很可能</b>：具二項核心特徵，或一項核心+一項次要；<b>可能</b>：僅一項核心，或僅一項或以上次要特徵。",
    "D. 此困擾無法以腦血管疾病、另一神經退化病、物質生理效應、或另一精神、神經或系統性疾病做更好的解釋。"
  ],
  features:"包含漸進式認知減損（複雜注意力和執行功能早期變化，非學習記憶）+反覆複雜視幻覺+快速動眼期睡眠障礙（可為極早期表徵）+其他感官幻覺、憂鬱及妄想。症狀起伏可能相似譫妄但找不到潛在致病因，多樣性症狀短暫診間較不易觀察，須照護者仔細評估。另一核心特徵是<b>自發性巴金森氏症</b>，必須在認知下降之後發作（依共識，嚴重認知缺損須在運動症狀之前一年以上被觀察到）。<b>高達50%有嚴重抗精神病藥物敏感性</b>，用藥須極度小心。",

  prevalence:"佔一般老年族群0.1%-5%，佔所有失智個案1.7%-30.5%；大腦銀行研究中佔失智症20%-35%。男女比約1.5:1。",
  course:"漸進式發作逐漸進展，但通常有急性混亂發作（譫妄）前驅病史（常因疾病或手術加重）。認知下降在病程早期表現，即在運動症狀發生<b>一年以前</b>。臨床個案平均存活5-7年，症狀發作典型在60-90歲間，多數70歲間發作。",
  risk:"基因和生理：家族聚集可能發生，已確認數個危險基因，但多數無家族病史。",
  functional:"相較阿茲海默症，個案會有更嚴重功能性受損（運動和自主神經減損所致如廁活動飲食問題）；生活品質通常明顯較阿茲海默症個案差。",
  ddx:[

{

  id:"vasc", name:"血管疾病引起的認知障礙症或輕型血管疾病引起的認知障礙症", en:"Vascular NCD", code:"很可能290.40(F01.51/.50)；可能331.9；輕型331.83",
  criteria:[

  features:"需確立認知類障礙症，及確定腦血管疾病足以說明認知缺損（而非須排除的病變）。血管性病因範圍可由大血管中風至微血管疾病，臨床表現異質性大。可呈現<b>多處梗塞、急性階梯式或波動式認知下降</b>；或<b>緩慢進展的逐漸發作</b>（通常因小血管疾病導致白質、基底核及／或丘腦病灶），複雜注意力（處理速度）及執行功能常受影響。",
  assoc:"神經學評估常顯現中風/暫時性腦缺血發作病史及腦梗塞徵候；常與人格情緒改變、意志喪失、憂鬱、情緒不穩相關；<b>晚發憂鬱症狀伴精神運動減緩和執行失能</b>為老人漸進式小血管疾病常見表現（「血管性憂鬱」）。",
  prevalence:"次於阿茲海默症<b>第二常見</b>的認知類障礙症。美國血管性失智盛行率65-70歲0.2%，80歲以上16%。中風後3個月內20%-30%診斷為失智症。非裔美籍及東亞國家（日本、中國）盛行率較高；男性高於女性。",
  course:"盛行率65歲後指數化上升，但可發生於任何年紀。病程可從急性發作部分進步、到階梯式下降、到漸進式下降變化；純粹皮質下型可有類似阿茲海默症的緩慢漸進病程。",
  risk:"環境：神經可塑性因子（教育、運動、心智活動）影響結果。基因和生理：與腦血管疾病相同（高血壓、糖尿病、吸菸、肥胖、高膽固醇、高半胱氨酸、心房顫動等）；大腦澱粉樣血管病變、CADASIL為重要危險因子。",
  functional:"常見身體缺損相關造成附加障礙。",
  ddx:[
    ["其他認知障礙症","早期記憶缺損、漸進變差的記憶語言執行功能知覺動作能力，缺乏相對應局部病灶意味阿茲海默症為原發診斷；路易氏體須看核心特徵（認知波動、視幻覺、自發性巴金森特徵）；額顳葉退化的不知不覺發作及漸進行為/語言特質非血管病因典型。"],
    ["其他身體病況","在其他疾病（腦瘤、多發性硬化症、腦炎、毒物代謝障礙）不足以解釋認知減損狀況下不能診斷。"],
    ["其他精神疾病","若症狀可完全歸因於譫妄，診斷不合適（但譫妄可加重已存在的血管性NCD，兩者可同時診斷）；若符合重鬱症診斷且時間上認知減損與憂鬱有關，不應診斷血管性NCD；若認知障礙先於憂鬱發作或減損嚴重度與憂鬱程度不成比例，兩者皆應診斷。"]
  ],
  comorbid:"常與阿茲海默症同時發生（兩者皆應診斷）；常與憂鬱症共同發生。"

{

  specifiers:["評估認知障礙症的嚴重度，而非潛在的外傷性腦傷本身"],
  features:"認知表現多變：複雜注意力、執行能力、學習記憶領域困難，訊息處理速度減慢及社交認知困擾常見。較嚴重TBI（腦挫傷、顱內出血、穿刺傷）可能有額外缺損（失語症、忽略、建構性運動障礙）。外傷性腦傷嚴重度分輕微/中度/重度（依喪失意識、創傷後失憶、格拉斯哥昏迷指數評估），惟嚴重度評估本身不一定對應NCD嚴重度。",
  assoc:"可能伴隨情緒困擾（易怒、挫折感、緊張焦慮、情緒波動）；個性改變（去抑制化、淡漠、多疑、憤怒）；身體困擾（頭痛、疲累、睡眠障礙、眩暈、耳鳴、光敏感、嗅覺喪失、對精神藥物耐受性降低）；較嚴重者有神經症狀癥候（癲癇、偏癱、視覺困擾）。",
  prevalence:"美國每年170萬TBI發生，140萬急診人次，275,000住院人次，52,000死亡。約2%有TBI相關殘疾。男性佔59%。最常見病因為跌倒、車禍、頭部重擊。",
  course:"輕微TBI神經認知症狀通常受傷後數天至數星期恢復，典型3個月內完全痊癒；隨後顯著惡化應考慮其他診斷；但<b>重複輕微TBI可能和持續神經認知困擾相關</b>。中重度TBI除持續神經認知缺損外，也有神經生理、情緒行為併發症（癲癇尤其第一年、光敏感、易怒、憂鬱、睡眠障礙、疲累、淡漠），可能增加憂鬱、憤怒及神經退化疾病（如阿茲海默症）風險。",
  risk:"TBI危險因子：&lt;4歲、年長青少年、&gt;65歲盛行率最高，跌倒最常見原因。TBI後NCD危險因子：反覆腦震盪可能導致持續性NCD；病程修飾因子：較大年紀(&gt;40歲)、較差格拉斯哥昏迷指數、較差運動功能、瞳孔無活動、電腦斷層腦傷證據，與中重度TBI最差結果相關。",
  functional:"輕型NCD可能告知認知效率減低、注意力困難；認知障礙症可能獨立生活自我照顧有困難；顯著神經運動特質（不協調、步態不穩、運動緩慢）增加功能困難；有TBI病史者更多憂鬱症狀，可使認知抱怨加劇。",
  ddx:[
    ["身體症狀障礙症或人為障礙症","某些病例神經認知症狀嚴重度可能和TBI嚴重度不符合，排除未察覺神經併發症後需考慮此可能性。"],
    ["創傷後壓力症候群(PTSD)","可與NCD共病，有共同症狀（注意力困難、憂鬱心情、憤怒行為去抑制化），特別在軍人族群。"]
  ],
  comorbid:"物質使用障礙症的神經認知影響可導致或混合TBI相關神經認知改變；TBI經常和物質使用同時發生；與PTSD可同時發生（尤其軍人）。"
},
{
  group:"病因學亞型",
  id:"sub", name:"物質／醫藥引發的認知障礙症或輕型認知障礙症", en:"Substance/Medication-Induced NCD", code:"依物質類別及是否共病SUD編碼",
  criteria:[
    "A. 合乎認知障礙症或輕型認知障礙症診斷準則。",
    "B. 認知功能減損<b>不只發生在譫妄過程</b>，且持續超過物質中毒或急性戒斷期。",

    "D. 認知功能缺損的時序過程與物質或醫藥的使用及停止使用時間一致（如停止使用一段時間後變得穩定或改善）。",
    "E. 認知障礙症無法歸因於另一身體病況及無法以另一精神疾病做更好的解釋。"

  specifiers:["症狀持續：認知減損在停止使用物質後一段時間仍持續顯著"],
  features:"特徵為認知功能減損持續超過中毒及急性戒斷常見時間；最初可能反映腦部功能於長期物質使用中恢復（數月後可察覺神經認知及腦影像進步）。特定藥物類別有不同表現：<b>鎮定劑/安眠藥/抗焦慮藥</b>可能記憶方面障礙較大；<b>酒精</b>常表現執行功能+記憶學習範疇的綜合減損；<b>酒精引起的失憶性虛談（柯沙可夫氏）NCD</b>特徵為顯著失憶（學習困難+快速遺忘）及虛談傾向，可能與魏尼凱氏腦病變（硫胺素缺乏，眼震、步態不穩、外側凝視麻痺）共存；<b>甲基安非他命</b>除神經認知症狀外可能有血管損傷跡象（局部無力、單側不協調）。",
  assoc:"中樞神經抑制藥物引起即期NCD可能伴易怒、焦慮、睡眠障礙、不悅；興奮劑引起即期NCD可能有反彈性憂鬱、嗜睡、淡漠；嚴重物質/醫藥引起認知障礙症（如長期酒精使用）可能有顯著神經運動特質（不協調、步態不穩、運動減緩）及情緒失控。",
  prevalence:"此類狀況盛行率未知。酒精濫用者即期輕型NCD在戒除前兩個月盛行率約30%-40%；認知障礙症罕見（可能因同時營養缺損）。戒除古柯鹼、甲基安非他命、鴉片、phencyclidine、鎮定安眠抗焦慮藥者，<b>三分之一以上</b>會發生即期輕型NCD。",
  course:"物質使用障礙常始於青少年，20-30歲達頂峰。50歲前達到穩定戒除者常見顯著甚至完全復原；50歲後持續物質濫用則極可能變成持續性（推測合併神經可塑性下降和年紀相關大腦變化）。越早開始濫用（尤其酒精）可能導致之後神經發展缺陷。",
  risk:"年紀大、長時間使用、50歲後持續使用；對酒精引起NCD，長期營養缺乏、肝臟疾病、血管危險因子及心腦血管疾病也可能導致危險。",
  ddx:[["非物質使用相關的認知類障礙症","物質使用障礙、中毒及戒斷可能單獨或混合影響增加其他病況風險（如伴隨的外傷性腦傷、感染史HIV/C肝/梅毒）；須區分非物質使用狀況下的認知類障礙症及其伴隨病況。"]],
  comorbid:"極易共病其他精神疾病（PTSD、憂鬱症、雙相、神經發育障礙症）；外傷性腦傷經常和物質使用同時發生，使病因確定更費心；嚴重長期酒精使用障礙症可能和重要器官系統性疾病相關（腦血管疾病、肝硬化）；安非他命引起的NCD可能伴隨血管性NCD。"

{
  group:"病因學亞型",
  id:"hiv", name:"人類免疫缺乏病毒感染引起的認知障礙症或輕型認知障礙症", en:"NCD Due to HIV Infection", code:"042(B20)+294.11/294.10；輕型331.83",
  criteria:[
    "A. 合乎認知障礙症或輕型認知障礙症診斷準則。",
    "B. 有確定的人類免疫缺乏病毒感染。",
    "C. 此認知障礙症無法以非HIV感染的情況下做更好的解釋，包括續發性腦疾病，如漸進性多病灶腦白質病或隱球菌腦膜炎。",
    "D. 認知障礙症無法歸因於另一種身體病況，及藉由另一種精神疾病做更好的解釋。"

  features:"HIV-1感染經注射藥物、未防護性接觸或意外/醫源性暴露傳染。感染耗盡CD4淋巴球導致嚴重免疫功能不足，通常致伺機性感染及腫瘤增生（AIDS）。發展出認知類障礙症通常表現<b>「皮質下型」</b>：顯著執行功能減損、處理速度減緩、注意力工作較多問題、學習新資訊困難，但回憶已知訊息問題較少。認知障礙症階段速度減緩顯著；言語困難（失語症）較不常見。",
  assoc:"經常盛行於先前併發嚴重免疫抑制個案（如腦脊髓液病毒負荷量高、貧血、白蛋白低下）。嚴重NCD可能有顯著神經運動特質（嚴重不協調、步態不穩、運動減緩）及情緒失控。",
  prevalence:"依HIV疾病階段，近1/3至1/2以上感染個案至少有輕型認知困擾（但不符合輕型NCD所有準則）；估計約<b>25%</b>符合輕型NCD準則，<b>&lt;5%</b>符合認知障礙症準則。",
  course:"可復原、改善、慢慢惡化或起伏。快速進展至嚴重神經認知減損在現有綜合抗病毒治療下不常見；出現立即心智改變應立刻評估其他身體病因（含次發性感染）。發展中國家（尤其非洲撒哈拉以南）垂直感染常見，嬰兒兒童NCD主要呈現神經發展遲緩。倖存至老年者可能有HIV和老化交互的神經認知影響（含阿茲海默症、巴金森氏症等）。",
  risk:"HIV感染危險因子：毒品注射、無防護性行為、無防護血液供應、醫源性因素。NCD危險因子：中樞神經系統HIV控制不全、抗藥性病毒株、長期慢性系統性及腦部發炎、共病因子（年老、毒品濫用、CNS外傷史、C型肝炎），矛盾的是抗反轉錄病毒治療出現後NCD並未顯著下降（但最嚴重表現已急遽下降）。",
  functional:"個案間差異大；受損執行能力和訊息處理減緩可能大程度影響複雜疾病控制決策，也影響順從合併抗病毒療法。",
  ddx:[["其他病因引起的認知下降","出現共病（其他感染、藥物濫用、之前頭部受傷、神經發展障礙）不排除HIV引起NCD診斷（只要有HIV感染加重之前存在或共病病況的證據）；老年人應鑑別腦血管疾病或神經退化引起的認知下降；穩定、起伏或改善的神經認知狀態傾向病因為HIV；突發變嚴重需積極尋找非HIV病因（伺機感染、腫瘤）。"]],
  comorbid:"伴隨腦血管疾病和代謝症候群相關的長期系統性及神經發炎；常同時發生注射方式物質使用障礙症及其他性傳染疾病。"
},

  id:"prion", name:"普利昂病引起的認知障礙症或輕型認知障礙症", en:"NCD Due to Prion Disease", code:"046.79(A81.9)+294.11/294.10；輕型331.83",

  features:"包含一群由亞急性海綿狀腦病變引起的認知類障礙症（庫賈氏病、變異型庫賈氏症「狂牛病相關」、克魯症、GSS氏症、致死性家族性失眠症），致病原為普利昂。庫賈氏症表現認知缺損、步態不穩、異常動作（肌躍症、舞蹈症、肌張力不全症），常見驚嚇反射。<b>病史顯現6個月內快速進展至認知障礙症</b>。變異型庫賈氏症可能表現精神病症狀（情緒低落、退縮、焦慮）。診斷通常需至少一項生物標記：MRI擴散權重影像或FLAIR可辨識病灶、腦脊髓液tau蛋白或14-3-3蛋白、腦電波圖特症性三相波、或家族性形式的基因檢測。",
  prevalence:"散發型庫賈氏症年發生率每百萬人1-2人。因存活時間短所以盛行率非常低。",

  risk:"環境：曾出現跨物種傳染普利昂感染（1990年代英國牛海綿狀腦病爆發相關的變異型庫賈氏症）；角膜移植、人類生長因子注射傳染有文獻記載。基因和生理：有基因成分案例達15%，為自體顯性突變相關。",
  ddx:[["其他認知障礙症","可能表現類似病程，但普利昂病通常可藉<b>快速進展</b>及<b>顯著小腦及運動症狀</b>而區分。"]]

  features:"巴金森氏症發作後出現認知下降為必要特質。當無另一障礙症造成認知下降證據，且巴金森氏症顯然於認知障礙症之前發作，視為<b>很可能</b>；僅符合其一則為<b>可能</b>。",

  prevalence:"美國巴金森氏症盛行率隨年紀增加，65-69歲約0.5%，85歲以上3%；較常見於男性。<b>多達75%</b>巴金森氏症患者病程中會發展為認知障礙症；輕型NCD盛行率約<b>27%</b>。",

  risk:"環境：曾暴露於除草劑或殺蟲劑。基因和生理：疾病晚發和長時間罹病是潛在NCD危險因子。",
  ddx:[
    ["路易氏體認知障礙症","<b>核心鑑別</b>：依運動和認知症狀的時間點順序區別——巴金森氏症的運動症狀必須在認知下降達認知障礙症程度<b>之前</b>出現（慣例至少一年以前）；路易氏體則認知症狀在運動症狀之前不久開始或同時出現。輕型NCD時間點較難確立，兩障礙症存在於一個診斷連續體上，除非能確立先後關係，否則較適合診斷非特定輕型認知障礙症。"],
    ["阿茲海默症引起的NCD","運動特質是區分關鍵；兩疾病可同時發生。"],

  features:"進展的認知減損為核心特質，伴早期<b>執行功能</b>（處理速度、組織及計畫）改變，而非學習記憶減損。認知和行為改變通常於<b>動作遲緩</b>及<b>舞蹈症</b>（不自主急動式動作）等典型運動異常發生<b>之前</b>出現。家族病史或基因檢測顯示第4對染色體HTT基因CAG三核苷酸重複擴增，加上明確錐體外運動異常，可確診。",

const tabbar = document.getElementById('tabbar');
const content = document.getElementById('content');
let lastGroup = "";
disorders.forEach((d,i)=>{
  if(d.group !== lastGroup){
    const label = document.createElement('span');
    label.className = 'grp-label';
    label.textContent = '── ' + d.group + ' ──';
    tabbar.appendChild(label);
    lastGroup = d.group;
  }
  const btn=document.createElement('button');
  btn.textContent=d.name.length>10 ? d.name.replace(/引起的認知障礙症或輕型認知障礙症/,'').replace(/引起的/,'').replace(/造成的/,'') : d.name;
  btn.onclick=()=>show(i);
  btn.id='tab-'+d.id;
  tabbar.appendChild(btn);
});
const compareBtn=document.createElement('button');
compareBtn.textContent='★ 綜合比較表';
compareBtn.id='tab-compare';
compareBtn.onclick=()=>showCompare();
tabbar.appendChild(compareBtn);

function fieldBlock(title,text){
  if(!text) return '';
  return `<h3>${title}</h3><div>${text}</div>`;
}
function ddxBlock(list){
  if(!list) return '';
  let html = '<h3>鑑別診斷 (Differential Diagnosis) ★</h3>';
  list.forEach(([name,text])=>{
    html += `<div class="ddx-item"><b>${name}：</b>${text}</div>`;
  });
  return html;
}

function renderDisorder(d){
  let html = `<h2 class="dx-title">${d.name} <span class="small">${d.en}</span></h2>`;
  html += `<div class="code">診斷碼：${d.code}</div>`;
  html += `<h3>診斷準則 (Diagnostic Criteria) ★★</h3>`;
  html += `<div class="crit-box"><ul>${d.criteria.map(c=>`<li>${c}</li>`).join('')}</ul></div>`;
  if(d.specifiers){
    html += `<h3>特別註明 (Specifiers)</h3><div class="note"><ul>${d.specifiers.map(s=>`<li>${s}</li>`).join('')}</ul></div>`;
  }
  html += fieldBlock('診斷特質 (Diagnostic Features)', d.features);
  html += fieldBlock('支持診斷相關特質 (Associated Features)', d.assoc);
  html += fieldBlock('盛行率 (Prevalence)', d.prevalence);
  html += fieldBlock('發展和病程 (Development and Course)', d.course);
  html += fieldBlock('風險和預後因子 (Risk and Prognostic Factors)', d.risk);
  html += fieldBlock('性別相關診斷議題 (Gender-Related)', d.gender);
  html += fieldBlock('文化相關診斷議題 (Culture-Related)', d.culture);
  html += fieldBlock('功能性後果 (Functional Consequences)', d.functional);
  html += ddxBlock(d.ddx);
  html += fieldBlock('共病 (Comorbidity)', d.comorbid);
  return html;
}

function show(i){
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+disorders[i].id).classList.add('active');
  const section=document.createElement('section');
  section.className='active';
  section.innerHTML = renderDisorder(disorders[i]);
  content.innerHTML='';
  content.appendChild(section);
  window.scrollTo({top:0,behavior:'smooth'});
}

  <h3>本章共同主軸（整章導言重點）</h3>
  <ul>
  <li>NCD以<span class="compare-highlight">認知範疇</span>（複雜注意力、執行功能、學習記憶、語言、知覺動作、社交認知）的定義為診斷準則基礎，形成診斷層次(認知障礙症vs.輕型)和亞型的基礎。</li>
  <li><b>認知障礙症(major NCD)</b>大致相當於DSM-IV的「失智」，但定義稍廣（範疇顯著能力下降即可下診斷）；DSM-IV的「失憶性疾患」現改診斷為<b>另一身體病況造成的NCD</b>（此情況下不使用「失智」術語）。</li>
  <li>認知障礙症與輕型認知障礙症的關鍵鑑別在於<span class="compare-highlight">功能獨立性</span>：認知障礙症需要協助才能完成複雜工具性日常生活活動；輕型NCD可獨立完成但需更費力或補償策略。兩者檢測結果的統計閾值：認知障礙症通常低於常態2個標準差以上(第3百分位以下)；輕型NCD則在1-2個標準差之間(第3-16百分位)。</li>
  <li>本章行為/精神症狀特別註明適用於<b>所有</b>亞型：<span class="compare-highlight">精神症狀</span>（多疑妄想常見，被害主題突出；視幻覺在NCD中比憂鬱症/雙相/精神病症更常見）、<span class="compare-highlight">情緒困擾</span>（憂鬱在阿茲海默症和巴金森氏症早期常見；歡欣較常見於額顳葉退化）、<span class="compare-highlight">激動</span>（中重度NCD常見，常發生在混亂或抵抗照顧情境下）、<span class="compare-highlight">淡漠</span>（輕型NCD及輕度認知障礙症常見，尤其阿茲海默症和額顳葉退化）。</li>
  <li>NCD亞型的診斷邏輯分兩類：①<b>病因明確可獨立辨識者</b>（巴金森氏症、亨丁頓病、TBI、恰當時間內的中風）診斷主要依賴潛在病因的出現；②<b>廣泛神經退化性疾病</b>（阿茲海默症、額顳葉退化、路易氏體）診斷主要依賴認知、行為及功能症狀本身。</li>
  <li>年紀是所有NCD最重要的共同風險因子（增加神經退化及腦血管疾病風險），但不同亞型的好發年齡不同：阿茲海默症60歲後盛行率急遽上升；額顳葉退化好發較早(&lt;65歲常見)且隨年紀增長比率下降。</li>
  </ul>
