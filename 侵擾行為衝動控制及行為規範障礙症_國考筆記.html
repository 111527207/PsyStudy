function fieldBlock(title,text){
  if(!text) return '';
  return `<h3>${title}</h3><div>${text}</div>`;
}
function ddxBlock(list){
  if(!list) return '';
  let html = '<h3>鑑別診斷 (Differential Diagnosis) ★</h3>';
  list.forEach(([name,text])=>{
    html += `<div class="ddx-item"><b>${name}：</b>${text}</div>`;
  });
  return html;
}

function renderDisorder(d){
  let html = `<h2 class="dx-title">${d.name} <span class="small">${d.en}</span></h2>`;
  html += `<div class="code">診斷碼：${d.code}</div>`;
  html += `<h3>診斷準則 (Diagnostic Criteria) ★★</h3>`;
  html += `<div class="crit-box"><ul>${d.criteria.map(c=>`<li>${c}</li>`).join('')}</ul></div>`;
  if(d.specifiers){
    html += `<h3>特別註明 (Specifiers)</h3><div class="note"><ul>${d.specifiers.map(s=>`<li>${s}</li>`).join('')}</ul></div>`;
  }
  html += fieldBlock('診斷特質 (Diagnostic Features)', d.features);
  html += fieldBlock('支持診斷相關特質 (Associated Features)', d.assoc);
  html += fieldBlock('盛行率 (Prevalence)', d.prevalence);
  html += fieldBlock('發展和病程 (Development and Course)', d.course);
  html += fieldBlock('風險和預後因子 (Risk and Prognostic Factors)', d.risk);
  html += fieldBlock('性別相關診斷議題 (Gender-Related)', d.gender);
  html += fieldBlock('文化相關診斷議題 (Culture-Related)', d.culture);
  html += fieldBlock('功能性後果 (Functional Consequences)', d.functional);
  html += ddxBlock(d.ddx);
  html += fieldBlock('共病 (Comorbidity)', d.comorbid);
  return html;
}

function show(i){
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+disorders[i].id).classList.add('active');
  const section=document.createElement('section');
  section.className='active';
  section.innerHTML = renderDisorder(disorders[i]);
  content.innerHTML='';
  content.appendChild(section);
  window.scrollTo({top:0,behavior:'smooth'});
}

function showCompare(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-compare').classList.add('active');
  const section=document.createElement('section');
  section.className='active';
  section.innerHTML = `
  <h2 class="dx-title">七大疾病綜合比較表</h2>
  <table>
  <tr><th>疾病</th><th>核心問題型態</th><th>是否有預謀</th><th>是否含攻擊他人/動物</th><th>起病年齡</th><th>性別</th><th>盛行率</th></tr>
  <tr><td><b>對立反抗症</b></td><td>情緒(生氣易怒)+行為(好爭辯反抗報復)</td><td>否</td><td>否</td><td>學齡前</td><td>兒童期男&gt;女(1.4:1)</td><td>~3.3%</td></tr>
  <tr><td><b>間歇暴怒障礙症</b></td><td>純衝動性憤怒攻擊爆發</td><td><b>否，衝動性</b></td><td>有(對物/動物/人)</td><td>兒童晚期/青少年，≥6歲</td><td>男可能&gt;女</td><td>~2.7%</td></tr>
  <tr><td><b>行為規範障礙症</b></td><td>廣泛違反他人權利/社會常規的行為模式</td><td><b>可有預謀掠奪性</b></td><td><b>有(核心類別之一)</b></td><td>兒童中期-青少年中期</td><td>男&gt;女</td><td>~4%(中位數)</td></tr>
  <tr><td><b>反社會型人格障礙症</b></td><td>廣泛反社會行為模式(需18歲以上，且18歲前有CD史)</td><td>可有預謀</td><td>可有</td><td>≥18歲診斷</td><td>男&gt;女</td><td>—</td></tr>
  <tr><td><b>病態縱火症</b></td><td>對縱火本身著迷，非為達成其他目的</td><td><b>有(故意而有目的)</b>但非為利益</td><td>否(針對財物/火)</td><td>資料不足</td><td>男&gt;女</td><td>縱火行為1.13%(終生)；主診罕見</td></tr>
  <tr><td><b>病態偷竊症</b></td><td>對偷竊衝動本身無法抗拒，非為物品或金錢</td><td><b>否，非事先規劃</b></td><td>否</td><td>常始於青少年</td><td><b>女&gt;男(3:1)</b></td><td>一般人群0.3-0.6%</td></tr>
  </table>

  <h3>易混淆疾病快速鑑別</h3>
  <div class="ddx-item"><b>對立反抗症 vs. 行為規範障礙症：</b>核心在<span class="compare-highlight">嚴重度與行為類型</span>——ODD不含對人/動物攻擊、財物破壞、偷竊或欺騙模式，且含情緒調節問題（生氣易怒）；CD則以四大類違反他人權利行為為核心，不特別強調情緒面。<b>兩者準則皆符合時可同時診斷</b>（ODD常為CD的前驅狀況，尤其兒童期初發型）。</div>
  <div class="ddx-item"><b>對立反抗症 vs. 侵擾性情緒失調症(DMDD)：</b>兩者皆有慢性負面情緒和脾氣爆發，但<span class="compare-highlight">DMDD的脾氣爆發嚴重度、頻率、長期性更嚴重</span>；DMDD需在10歲前首次出現、不能在18歲後首次診斷；<b>當DMDD準則滿足時，即使ODD所有準則皆符合，也不給予ODD診斷</b>（不可並存）。</div>
  <div class="ddx-item"><b>間歇暴怒障礙症 vs. 行為規範障礙症：</b>關鍵在<span class="compare-highlight">是否有預謀</span>——IED攻擊僅限<b>衝動性</b>、非為達成實質目的（錢/權力/威嚇）；CD攻擊可為<b>有預謀掠奪性</b>行為，且CD含非攻擊性症狀（財物破壞、欺騙偷竊、重大違規）而IED不含。若兩者皆符合，IED僅在攻擊爆發需獨立臨床關注時才附加診斷。</div>
  <div class="ddx-item"><b>間歇暴怒障礙症 vs. 侵擾性情緒失調症：</b>DMDD以攻擊爆發<span class="compare-highlight">間隔期間持續存在的負面情緒狀態</span>為特徵（幾乎每天）；且DMDD僅能在10-18歲之間首次診斷。<b>兩診斷彼此互斥</b>，不可並存。</div>
  <div class="ddx-item"><b>行為規範障礙症 vs. 反社會型人格障礙症：</b>CD若持續至<span class="compare-highlight">滿18歲</span>且符合ASPD準則，應改診斷ASPD而非CD（CD準則C明訂：滿18歲應未達ASPD診斷準則，兩者不並存）。ASPD要求18歲前已有CD病史。</div>
  <div class="ddx-item"><b>病態縱火症 vs. 行為規範障礙症/躁症/反社會型人格障礙症：</b>若縱火可被這些疾病<span class="compare-highlight">更好解釋</span>，則不應獨立診斷病態縱火症；病態縱火症的縱火須是<b>對火本身的著迷與愉悅感所驅動</b>，而非為了實質利益、報復或反社會目的。</div>
  <div class="ddx-item"><b>病態偷竊症 vs. 一般竊盜(含行為規範障礙症)：</b>核心在<span class="compare-highlight">動機</span>——一般竊盜（含CD中的偷竊）動機是物品<b>實用性或金錢價值</b>，可能有計畫性；病態偷竊症物品<b>非個人所需也非為金錢價值</b>，且<b>不會事先規劃</b>，純粹為緩解偷竊前的緊張感並在行竊時獲得愉悅滿足。病態偷竊症非常罕見，一般竊盜/入店行竊相對常見。</div>
  <div class="ddx-item"><b>病態縱火症/病態偷竊症 vs. 詐病：</b>詐病狀況下個體可能<span class="compare-highlight">模擬</span>病態縱火症/偷竊症症狀以迴避刑事起訴，需審慎鑑別意圖與外部利益。</div>

  <h3>本章共同主軸（整章導言重點）</h3>
  <ul>
  <li>本章疾病共同點在於<span class="compare-highlight">情緒和行為的自我控制問題</span>，特別之處在於這些問題表現為<b>侵犯他人權利的行為</b>（攻擊、破壞財物）和／或使個體與<b>社會規範或權威人物顯著衝突</b>。潛在原因在不同疾病及個體間差異很大。</li>
  <li>各疾病在<span class="compare-highlight">情緒 vs. 行為</span>兩種自我控制型態問題的強調程度上呈現光譜：CD準則大部分聚焦於<b>控制不良的行為</b>（違反他人權利/社會常規）；IED準則大部分聚焦於<b>控制不良的情緒</b>（與刺激不成比例的憤怒爆發）；<b>ODD則介於兩者之間</b>，準則較平均分布於情緒（生氣易怒）和行為（好爭辯反抗）。病態縱火症與病態偷竊症則是與<b>可舒緩內在張力的特定行為</b>相關的衝動控制困難，屬較少使用的診斷。</li>
  <li>本章疾病<b>皆是男性比女性更常見發生</b>（病態偷竊症例外，女性多於男性3:1），但男性占多數的相對程度依疾病和年齡而不同。</li>
  <li>本章疾病傾向<b>首次發病於兒童期或青少年期</b>；CD或ODD首次出現於成人期相當罕見。ODD和CD之間有<b>發展性關係</b>：大部分CD案例先前符合ODD診斷準則（尤其兒童期初發型），但大部分ODD兒童最終不會發展成CD。</li>
  <li>本章疾病症狀某種程度可發生於常態發展個體，因此判斷是否為疾病症狀時，須考慮<b>頻率、持續性、不同情境下的廣泛性，以及相對於年齡、性別、文化下的正常範圍</b>的損害程度。</li>
  <li>本章疾病與人格面向的<b>外向性光譜(externalizing spectrum)</b>有關——被標示為<b>去抑制(disinhibition)</b>和（相反地）<b>約束(constraint)</b>，較低程度上也與負面情緒有關。這些共有人格面向造成疾病間<b>高度共病</b>，且常與<b>物質使用障礙症和反社會型人格障礙症</b>共病，但構成外向性光譜的共同特質確切本質尚未知。</li>
  </ul>
  `;
  content.innerHTML='';
  content.appendChild(section);
  window.scrollTo({top:0,behavior:'smooth'});
}
