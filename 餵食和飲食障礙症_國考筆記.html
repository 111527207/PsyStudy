    "A. 限制攝取身體所需能量，並導致對其年齡、性別、發展狀況與生理健康而言<b>顯著過低的體重</b>。過低體重定義為少於最低正常值，或兒童青少年少於最低期望值。",
    "B. <b>強烈害怕體重增加或變胖</b>，或即使體重偏低仍持續抑制體重增加。",

  specifiers:[
    "限制型(F50.01)：近3個月內無反覆性暴食或清除行為，主要以節食、禁食和／或過度運動達到減重",
    "暴食／清除型(F50.02)：近3個月內有重覆性暴食或清除行為（自我催吐或不當使用瀉劑/利尿劑/灌腸劑）",
    "部分緩解期：不再符合準則A（低體重），但仍符合B或C",

    "嚴重度（依成人BMI或兒童青少年BMI百分位）：輕度BMI≥17／中度BMI 16-16.99／重度BMI 15-15.99／極重度BMI&lt;15（kg/m²）；可依臨床症狀、功能障礙及是否需監督而提高"
  ],
  features:"三大核心：①持續性能量攝入限制 ②強烈恐懼體重增加或變胖、或持續阻止體重增加的行為 ③自我感知體重或身形的干擾。兒童青少年可以「未達預期增重/未維持發育軌跡」取代體重減輕。BMI是有用指標（成人&lt;18.5為下限參考，&lt;17.0為WHO中重度消瘦；兒童以BMI年齡百分位判斷，第5百分位以下暗示低體重）。準則B可能透過側面病史/縱向病程推斷，年輕患者及部分成人可能<b>無法識別或確認</b>對增重的恐懼。準則C：對體重身材的經驗被扭曲，自尊高度依賴身體形狀體重感知，減肥視為成就，增重視為失敗；患者常<b>缺乏病識感</b>，少抱怨減肥本身，多因家人帶去或飢餓身心後遺症而就醫。",
  assoc:"半飢餓及清除行為可致嚴重甚至危及生命病症；常見停經、生命徵象異常；多數生理紊亂可經營養復原逆轉，但骨密度損失常不完全可逆。體重嚴重不足時常有憂鬱症狀（情緒低落、社會退縮、煩躁、失眠、性慾減退），可能繼發於半飢餓，也可能足夠嚴重下憂鬱症診斷。強迫特徵常見（食物念頭盤旋、收集食譜/囤積食物）；若強迫觀念/行為與食物體重身形無關，可能需額外OCD診斷。暴食/清除型比限制型有更高衝動率、更可能濫用酒精藥物。部分患者過度體力活動（常先於發病，並加速減肥，治療期間可能危及體重恢復）。可能操縱藥物劑量減肥（糖尿病患省略/減少胰島素）。",
  prevalence:"年輕女性12個月盛行率約<b>0.4%</b>，男性所知較少；臨床族群女男比約<b>10:1</b>。",
  course:"常始於青春期或成年早期，少見於青春期前或40歲後。發病常與生活壓力事件相關（如離家上大學）。年輕患者可能表現非典型特徵（否認「怕胖」）；年長患者病程較長、臨床表現多長期病症徵象。多數5年內緩解，住院患者總緩解率可能更低。<b>粗死亡率(CMR)每十年約5%</b>，死因最常見為疾病相關醫療併發症或自殺。",
  risk:"氣質：焦慮症、強迫症或童年強迫特徵增加風險。環境：重視瘦的文化/場景（模特兒、運動員職業）增加風險。基因和生理：一等親風險增加（含暴食症）；同卵雙胞胎一致率顯著高於異卵；也增加雙相/憂鬱症風險（尤其暴食清除型）；功能性腦影像研究顯示異常，但與營養不良變化之相關性尚不清楚。",
  culture:"見於不同文化多種族群，跨文化表現有差異；最普遍於工業化高收入國家（美歐澳紐日），拉丁裔/非裔美國人/亞洲人發生率相對較低（可能反映心理衛生服務利用率低）。<b>「肥胖恐懼症」不明顯</b>——不表達強烈怕胖恐懼，在亞洲族群較常見（常以腸胃不適等文化認可抱怨表現），在美國拉丁裔群體也較常見。",
  suicide:"自殺風險升高，報告每年每10萬人中<b>12人</b>比率；綜合評估應包含自殺相關意念行為及其他危險因素（含自殺未遂史）。",
  functional:"功能限制範圍不一，部分維持社會職業活躍，部分表現顯著社會隔離和／或未能履行學業/職業潛力。",
  ddx:[

    ["重度憂鬱症","可能出現嚴重體重減輕，但大多數重鬱患者<b>沒有</b>過分減肥慾望或強烈怕胖恐懼。"],
    ["思覺失調症","可能有奇怪飲食習慣、偶爾顯著減肥，但很少有厭食症所需的怕胖恐懼及身體形象紊亂。"],
    ["物質使用障礙","營養攝入差可能致低體重，但一般不怕增重、無身體形象障礙；濫用抑制食慾物質（古柯鹼、興奮劑）且怕增重者，應審慎評估共病厭食症可能。"],
    ["社交焦慮症、強迫症、身體臆形症","特徵可能重疊：厭食症若社交焦慮<b>僅限於飲食行為</b>不應另診斷社交焦慮症（無關飲食的社交恐懼才附加診斷）；強迫症附加診斷限於<b>與食物無關</b>的強迫意念行為（如污染恐懼）；身體臆形症附加診斷限於<b>與身形體重無關</b>的扭曲（如執著鼻子太大）。"],
    ["暴食症","厭食症暴食/清除型 vs. 暴食症的關鍵鑑別：<b>暴食症個體維持體重在正常或高於最低正常水平</b>；厭食症暴食清除型則為顯著低體重。"],
    ["ARFID","ARFID患者可能顯著低體重/營養缺乏，但<b>沒有</b>怕胖恐懼，也不影響對身形體重的經驗。"]

  comorbid:"雙相情緒障礙症、憂鬱症、焦慮症常見；許多患者提及飲食障礙發生前已有焦慮症狀/症。強迫症在某些患者中被描述（尤其限制型）。酒精及其他物質使用障礙也可能共病，特別是暴食/清除類型。"

  features:"三大基本特點：①暴食反覆發作（準則A）②反覆發作的不恰當補償行為以防止發胖（準則B）③受身形和體重不當影響的自我評價（準則D）。診斷要求兩者平均每週至少一次、連續3個月（準則C）。「暴飲暴食發作」的不連續時間週期通常<b>少於2小時</b>，單次發作不必限於一個場合。失控感（準則A2）指標：一旦開始就不能不吃或停止；部分患者描述解離特質；控制受損與暴食未必絕對相關（如電話響仍繼續、室友進門即停止）。清除行為（purging）最常見是<b>嘔吐</b>，其他包括瀉藥、利尿劑濫用、灌腸劑（少見）、甲狀腺激素、省略/減少胰島素劑量（糖尿病患）、禁食、過度運動。若暴食/補償僅發生於厭食症發作期間，不能給暴食症診斷（準則E）。",
  assoc:"通常正常體重或過重範圍（BMI≥18.5且&lt;30）；肥胖者可發生但不常見。暴食間期常限制總熱量攝取、選擇低熱量食物。<b>月經不規則或無月經</b>常見於女性患者。清除導致的體液電解質紊亂有時嚴重到構成醫療問題；罕見但可能致命：食道撕裂、胃破裂、心律異常。反覆使用吐根糖漿催吐者曾有嚴重心臟骨骼肌病變報導。慢性瀉藥濫用者可能依賴其刺激腸蠕動；常有胃腸道症狀，也有直腸脫垂個案。",
  prevalence:"年輕女性12個月盛行率<b>1%-1.5%</b>；高峰在青春期晚期和成人早期；男性所知較少，女男比約<b>10:1</b>。",
  course:"常始於青春期或成年早期，青春期前或40歲後發病不常見。常穿插於暴飲暴食期與節食減肥之間；多個壓力生活事件可誘發。混亂飲食行為高比率持續至少數年，病程可慢性或間歇性；緩解期超過1年與較好長期預後相關。<b>CMR每十年近2%</b>（各種原因及自殺）。少數(10%-15%)最初診斷跨越為厭食症；一小群患者持續狂吃但不再從事補償行為，可能轉為嗜食症或其他特定飲食失調症；診斷基於當前（過去3個月）臨床表現。",
  risk:"氣質：體重擔憂、自卑、憂鬱症狀、社交焦慮、童年過度焦慮增加風險。環境：「瘦即好」內化增加體重關注及暴食症風險；童年性/身體虐待增加風險。基因和生理：兒童肥胖症、青春早熟增長風險；有家族遺傳性/遺傳脆弱性。病程修飾：精神共病嚴重程度預測更差長期結果。",
  culture:"多數工業化國家（美加歐澳日紐南非）報導相似發生頻率；美國臨床研究以白人為主，但其他民族盛行率與白人樣本相似。",

  ddx:[

  features:"基本特徵是反覆發作的暴飲暴食，平均每週至少一次、連續3個月（準則D）。「陣發性暴食」定義同暴食症（不連續時段內、通常≤2小時，量絕對多於他人）。失控感為必要條件（準則A2）。暴飲暴食須伴隨顯著苦惱及至少三項特點（吃快、吃到不舒服、不餓仍吃、獨自進食因尷尬、事後厭惡自己/憂鬱/內疚）。<b>與暴食症的關鍵差異：無規律性不當補償行為</b>。最常見前導事件為負面情感；其他誘因含人際壓力、節制飲食、對體重身形食物的負面情緒、無聊。",

const tabbar = document.getElementById('tabbar');
const content = document.getElementById('content');

disorders.forEach((d,i)=>{
  const btn=document.createElement('button');
  btn.textContent=d.name;
  btn.onclick=()=>show(i);
  btn.id='tab-'+d.id;
  tabbar.appendChild(btn);
});
const compareBtn=document.createElement('button');
compareBtn.textContent='★ 綜合比較表';
compareBtn.id='tab-compare';
compareBtn.onclick=()=>showCompare();
tabbar.appendChild(compareBtn);

function fieldBlock(title,text){
  if(!text) return '';
  return `<h3>${title}</h3><div>${text}</div>`;
}
function ddxBlock(list){
  if(!list) return '';
  let html = '<h3>鑑別診斷 (Differential Diagnosis) ★</h3>';
  list.forEach(([name,text])=>{
    html += `<div class="ddx-item"><b>${name}：</b>${text}</div>`;
  });
  return html;
}

function renderDisorder(d){
  let html = `<h2 class="dx-title">${d.name} <span class="small">${d.en}</span></h2>`;
  html += `<div class="code">診斷碼：${d.code}</div>`;
  html += `<h3>診斷準則 (Diagnostic Criteria) ★★</h3>`;
  html += `<div class="crit-box"><ul>${d.criteria.map(c=>`<li>${c}</li>`).join('')}</ul></div>`;
  if(d.specifiers){
    html += `<h3>特別註明 (Specifiers)</h3><div class="note"><ul>${d.specifiers.map(s=>`<li>${s}</li>`).join('')}</ul></div>`;
  }
  html += fieldBlock('診斷特質 (Diagnostic Features)', d.features);
  html += fieldBlock('支持診斷相關特質 (Associated Features)', d.assoc);
  html += fieldBlock('盛行率 (Prevalence)', d.prevalence);
  html += fieldBlock('發展和病程 (Development and Course)', d.course);
  html += fieldBlock('風險和預後因子 (Risk and Prognostic Factors)', d.risk);
  html += fieldBlock('性別相關診斷議題 (Gender-Related)', d.gender);
  html += fieldBlock('文化相關診斷議題 (Culture-Related)', d.culture);
  html += fieldBlock('自殺風險 (Suicide Risk)', d.suicide);
  html += fieldBlock('功能性後果 (Functional Consequences)', d.functional);
  html += ddxBlock(d.ddx);
  html += fieldBlock('共病 (Comorbidity)', d.comorbid);
  return html;
}

function show(i){
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+disorders[i].id).classList.add('active');
  const section=document.createElement('section');
  section.className='active';
  section.innerHTML = renderDisorder(disorders[i]);
  content.innerHTML='';
  content.appendChild(section);
  window.scrollTo({top:0,behavior:'smooth'});
}

function showCompare(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-compare').classList.add('active');
  const section=document.createElement('section');
  section.className='active';
  section.innerHTML = `
  <h2 class="dx-title">七大疾病綜合比較表</h2>

  <tr><td><b>異食癖</b></td><td>—</td><td>—</td><td>—</td><td>依情況</td><td>男女皆可</td><td>不明</td></tr>

  <tr><td><b>厭食症</b></td><td>無/或有(暴食清除型)</td><td>暴食清除型有</td><td><b>核心特徵，有</b></td><td><b>顯著過低</b></td><td>10:1</td><td>0.4%(女,12個月)</td></tr>
  <tr><td><b>暴食症</b></td><td><b>有(核心)</b></td><td><b>有(規律)</b></td><td>有</td><td>正常/過重(BMI 18.5-30)</td><td>10:1</td><td>1-1.5%(女,12個月)</td></tr>

  <h3>易混淆疾病快速鑑別</h3>

  <div class="ddx-item"><b>嗜食症 vs. 單純肥胖：</b>肥胖非精神疾病診斷。嗜食症肥胖者<span class="compare-highlight">過度重視體重身形程度更高、精神共病率顯著較高、有實證心理治療長期成功結果</span>（肥胖則缺乏有效長期治療）。</div>

  <h3>本章共同主軸（整章導言重點）</h3>
  <ul>

  <li>此類障礙的特點是有<b>持續的飲食或飲食有關行為干擾</b>，導致食物消耗或吸收改變，且顯著損害身體健康或心理社會功能。</li>

  `;
  content.innerHTML='';
