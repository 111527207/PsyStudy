const tabbar = document.getElementById('tabbar');
const content = document.getElementById('content');
let lastGroup = "";
disorders.forEach((d,i)=>{
  if(d.group !== lastGroup){
    const label = document.createElement('span');
    label.className = 'grp-label';
    label.textContent = '── ' + d.group + ' ──';
    tabbar.appendChild(label);
    lastGroup = d.group;
  }
  const btn=document.createElement('button');
  btn.textContent=d.name;
  btn.onclick=()=>show(i);
  btn.id='tab-'+d.id;
  tabbar.appendChild(btn);
});
const compareBtn=document.createElement('button');
compareBtn.textContent='★ 綜合比較表';
compareBtn.id='tab-compare';
compareBtn.onclick=()=>showCompare();
tabbar.appendChild(compareBtn);

function fieldBlock(title,text){
  if(!text) return '';
  return `<h3>${title}</h3><div>${text}</div>`;
}
function ddxBlock(list){
  if(!list) return '';
  let html = '<h3>鑑別診斷 (Differential Diagnosis) ★</h3>';
  list.forEach(([name,text])=>{
    html += `<div class="ddx-item"><b>${name}：</b>${text}</div>`;
  });
  return html;
}

function renderDisorder(d){
  let html = `<h2 class="dx-title">${d.name} <span class="small">${d.en}</span></h2>`;
  html += `<div class="code">診斷碼：${d.code}</div>`;
  html += `<h3>診斷準則 (Diagnostic Criteria) ★★</h3>`;
  html += `<div class="crit-box"><ul>${d.criteria.map(c=>`<li>${c}</li>`).join('')}</ul></div>`;
  if(d.specifiers){
    html += `<h3>特別註明 (Specifiers)</h3><div class="note"><ul>${d.specifiers.map(s=>`<li>${s}</li>`).join('')}</ul></div>`;
  }
  html += fieldBlock('診斷特質 (Diagnostic Features)', d.features);
  html += fieldBlock('支持診斷相關特質 (Associated Features)', d.assoc);
  html += fieldBlock('盛行率 (Prevalence)', d.prevalence);
  html += fieldBlock('發展和病程 (Development and Course)', d.course);
  html += fieldBlock('風險和預後因子 (Risk and Prognostic Factors)', d.risk);
  html += fieldBlock('性別相關診斷議題 (Gender-Related)', d.gender);
  html += fieldBlock('文化相關診斷議題 (Culture-Related)', d.culture);
  html += fieldBlock('自殺風險 (Suicide Risk)', d.suicide);
  html += fieldBlock('功能性後果 (Functional Consequences)', d.functional);
  html += ddxBlock(d.ddx);
  html += fieldBlock('共病 (Comorbidity)', d.comorbid);
  return html;
}

function show(i){
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+disorders[i].id).classList.add('active');
  const section=document.createElement('section');
  section.className='active';
  section.innerHTML = renderDisorder(disorders[i]);
  content.innerHTML='';
  content.appendChild(section);
  window.scrollTo({top:0,behavior:'smooth'});
}

  <h3>易混淆疾病快速鑑別</h3>
  <div class="ddx-item"><b>酒精中毒 vs. 鎮靜安眠抗焦慮藥中毒：</b>臨床表現<span class="compare-highlight">幾乎完全相同</span>（言語不清、不協調、步伐不穩、眼球震顫、認知減損、呆滯昏迷）；鑑別依賴<b>呼氣有無酒味</b>及血液/尿液毒物分析，臨床上常需考慮<b>多重物質中毒</b>並存。</div>
  <div class="ddx-item"><b>酒精戒斷 vs. 鎮靜安眠抗焦慮藥戒斷：</b>症狀組成<span class="compare-highlight">幾乎相同</span>（自律神經過度活躍、手抖、噁心嘔吐、幻覺錯覺、精神動作激動、焦慮、癲癇大發作），須靠病史區分物質種類。</div>
  <div class="ddx-item"><b>鴉片中毒 vs. 鴉片戒斷：</b>核心鑑別在<span class="compare-highlight">瞳孔變化</span>——中毒時瞳孔<b>縮小</b>（除非嚴重過量缺氧致放大）；戒斷時瞳孔<b>放大</b>，並伴隨流淚流鼻水腹瀉等鴉片戒斷特有症狀（這些不會出現在鎮靜藥戒斷或其他中毒狀態）。</div>
  <div class="ddx-item"><b>興奮劑中毒 vs. 鴉片戒斷：</b>兩者都可能有瞳孔放大，但興奮劑中毒有<span class="compare-highlight">欣快感、警覺提高、心跳加速</span>等興奮表現；鴉片戒斷則以<b>噁心嘔吐腹瀉肌肉痠痛流淚流鼻水</b>等不適症狀為主，無興奮劑的中樞興奮特徵。</div>
  <div class="ddx-item"><b>苯環利定中毒 vs. 其他物質中毒：</b>核心鑑別特徵是<span class="compare-highlight">眼球震顫(垂直或水平，其他物質中毒罕見垂直震顫)及怪異暴力行為</span>；尿液可測得長達8天，但濃度與臨床表現關聯薄弱。</div>
  <div class="ddx-item"><b>迷幻藥中毒 vs. 迷幻藥持續知覺障礙症(HPPD)：</b>核心鑑別在<span class="compare-highlight">時間關係</span>——中毒的知覺症狀發生於服用當下並隨中毒結束；HPPD則是<b>停止使用後</b>，症狀仍陣發性或連續性維持數週、數月甚至數年，且與使用次數無強關聯（可能僅接觸微量迷幻藥即發病）。</div>
  <div class="ddx-item"><b>興奮劑戒斷 vs. 大麻戒斷：</b>兩者都有失眠(或嗜睡)、食慾增加、精神動作改變，但<span class="compare-highlight">興奮劑戒斷必要條件是「情緒不悅」+2項生理變化；大麻戒斷則強調易怒生氣攻擊性及身體不適（腹痛發抖冒汗發燒發冷頭痛）</span>，兩者可透過使用物質史區分。</div>
  <div class="ddx-item"><b>嗜賭症 vs. 躁症發作：</b>核心鑑別原則——<span class="compare-highlight">只有在賭博行為無法以躁症發作做更好解釋時，才可下嗜賭症診斷</span>（病史須顯示非躁症發作期間也有適應不良賭博行為）；反之，嗜賭症患者賭博期間也可能顯現類似躁症的行為，但遠離賭博後這些特徵會逐漸消失（與真正躁症發作的持續性不同）。</div>
  <div class="ddx-item"><b>使用障礙症 vs. 中毒/戒斷（結構性區別）：</b>三者是<span class="compare-highlight">不同時間軸的診斷</span>——「使用障礙症」描述<b>長期病態使用模式</b>（12個月內≥2/11或2/10項準則）；「中毒」「戒斷」描述<b>急性、當下的生理心理狀態</b>。三者可獨立存在或並存：例如吸入劑中毒可發生在完全不符合使用障礙症診斷的個體身上（如僅此一次意外/蓄意大量吸入）。</div>

  <h3>本章共同主軸（整章導言重點）</h3>
  <ul>
  <li>本章10大類物質<span class="compare-highlight">並非完全截然不同</span>：所有藥物過量使用時皆<b>直接活化大腦回饋系統</b>（涉及行為增強和記憶形成），產生強烈的「亢奮(high)」感受，使正常行為可能被忽略；自我控制較差（大腦抑制機轉受損）的個體特別容易發展物質使用障礙症，暗示部分根源在確切物質使用起始前即已存在。</li>
  <li>物質相關障礙症分兩組：<b>物質使用障礙症</b>（病態使用模式）與<b>物質引發的障礙症</b>（中毒、戒斷，以及其他物質/醫藥引發的精神疾病如精神病症/雙相/憂鬱/焦慮/強迫症/睡眠障礙/性功能障礙/譫妄/認知障礙症——這些收錄在各自相應的疾病章節中，與該章節共病症狀鑑別）。</li>
  <li>11項準則的<span class="compare-highlight">四大群組邏輯</span>貫穿所有物質：控制受損(1-4)、社交損害(5-7)、危險使用(8-9)、藥理準則耐受戒斷(10-11)。<b>苯環利定、其他迷幻藥、吸入劑</b>因戒斷症候群尚未在人類確立而僅有<b>10項準則</b>（無準則11）。<b>咖啡因是唯一沒有「使用障礙症」正式診斷的物質</b>（僅有中毒與戒斷）。</li>
  <li>本章唯一納入的<span class="compare-highlight">非物質相關（行為）成癮障礙症是嗜賭症</span>，反映賭博行為活化回饋系統及行為症狀與物質使用障礙症相似的證據；其他行為模式（性成癮、運動成癮、消費成癮、網路遊戲）因證據不足未正式納入診斷分類。</li>
  <li>幾乎每種物質的鑑別診斷都遵循相同邏輯：①與<b>其他物質中毒/戒斷</b>區分（常需毒物學檢測輔助，因多重物質使用常見）②與<b>該物質引發的其他精神疾病</b>區分（中毒/戒斷 vs. 引發障礙症——後者症狀嚴重度超過通常中毒戒斷範圍且需獨立臨床關注，才能加註引發障礙症診斷）③與<b>其他身體病況或原發精神疾病</b>區分（須釐清時序關係：症狀是否僅發生於使用/戒斷期間）。</li>
  <li>青少年<b>行為規範障礙症</b>及成人<b>反社會型人格障礙症</b>幾乎是所有物質相關障礙症共通的共病/鑑別考量點，因兩者與早發物質使用障礙症相關且預後較差。</li>
  </ul>
