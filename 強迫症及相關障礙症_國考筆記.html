    ["飲食障礙症","擔心變胖是飲食障礙症狀而非BDD；但體重擔心也可能發生於BDD，兩者可共病須兩診斷皆給予。"],
    ["其他強迫症及相關障礙症","BDD執著和重複行為只專注於外觀（OCD則否），且BDD病識感較差。摳皮為改善感受到的皮膚缺陷→診斷BDD而非摳皮症；移除毛髮為改善臉毛體毛外觀缺陷→診斷BDD而非拔毛症。"],
    ["罹病焦慮症","BDD患者不會執著於帶有或罹患嚴重疾病，不會有特別高度身體化症狀。"],
    ["重度憂鬱症","BDD顯著執著外觀及過度重複行為可資鑑別；憂鬱症狀在BDD患者常見，通常次發於BDD造成的苦惱損害，若符合BDD準則應給予BDD診斷。"],
    ["焦慮症","與社交焦慮症/懼曠症/畏避型人格障礙症不同，BDD包含顯著外觀執著(可達妄想程度)，重複行為社交焦慮退縮是因擔心外觀缺陷；與GAD不同，BDD焦慮擔憂專注於外觀瑕疵。"],
    ["精神病症","有妄想信念者診斷為BDD沒有病識感/具妄想信念，而非妄想症；與思覺失調症/情感思覺失調症不同，BDD涉及顯著外觀執著及相關重複行為而無混亂行為及其他精神病症狀。"],
    ["其他疾病和症狀","性別不悅症對第一第二性徵不適不診斷BDD；嗅覺關聯症候群(非DSM-5疾病)執著發出惡臭；身體完整認知障礙症(嗜殘症)想截肢非專注外觀；縮陽症(koro)恐懼陰莖縮小消失致死，專注死亡而非醜陋；畸形恐懼(非DSM-5疾病)是更廣義名詞，不等同BDD。"]
  ],
  comorbid:"重度憂鬱症最常見(經常在BDD之後發病)；社交焦慮障礙症(社交恐懼)、OCD及物質有關障礙症也很常見。"
},
{
  id:"hoarding", name:"儲物症", en:"Hoarding Disorder", code:"300.3 (F42.3)",
  criteria:[
    "A. 持續地難以丟棄所有物或與之分離，不管其實際價值如何。",
    "B. 這種困難是來自於覺得有保存這些物品的需求，以及對丟棄物品會感到苦惱。",
    "C. 難以丟棄所有物導致物品囤積，致使居住場所擁擠、凌亂不堪，以致於無法有效使用居所。如果居住場所並不凌亂，僅是因第三者干預（家庭成員、清潔工、權威人士）。",
    "D. 儲物症狀引起臨床上顯著苦惱或社交、職業或其他重要領域功能減損（包括維持自己和他人環境的安全）。",
    "E. 儲物症狀無法歸因於另一身體病況（腦傷、腦血管疾病、普瑞德-威利症候群）。",
    "F. 儲物症狀無法以另一精神疾病的症狀做更好的解釋（OCD強迫思考、憂鬱症精力減低、思覺失調症妄想、認知障礙症認知功能缺損、自閉症類群障礙症只關心特定事物）。"
  ],
  specifiers:[
    "過度收集：丟棄困難伴隨過度收集不需要或無處擺放的物品（80-90%患者表現此特質，最常見過度採購，其次收集免費物品）",
    "病識感：良好或尚可(認為信念行為是有問題的)／差(大多相信是沒問題的)／沒有病識感(或具妄想信念)(完全相信沒問題)"
  ],
  features:"核心是持續難以丟棄所有物或與之分離（含丟掉/出售/贈送/回收任何形式），不管其實際價值。困難主要原因為感覺物品用途美學價值或強烈情感依附；害怕遺漏重要訊息也常見。最常保留報紙雜誌舊衣提袋書信文件，實際上任何物品皆可能被保存(含有價值物品混雜堆積)。<b>有目的地保存並在面臨預期丟棄時感到苦惱</b>（區分於被動累積或移除時不感苦惱的其他精神病理）。囤積使居住場所充塞凌亂到無法有效使用(準則C強調「現行」活動空間而非車庫閣樓地下室)；即使因第三方介入(家人清潔員)而不凌亂，仍符合診斷。與正常搜集不同（正常搜集有組織系統，不導致典型凌亂苦惱損害）。",
  assoc:"猶豫不決、完美主義、迴避、拖延、計畫組織困難、易分心。部分居住於不衛生環境。<b>動物囤積</b>：囤積大量動物但無法提供最低標準營養衛生獸醫照護，可能是儲物症特殊表現；與物品儲物最大不同在於環境不衛生程度及更差病識感。",
  prevalence:"代表性全國盛行率尚未可得；美國歐洲社區調查點盛行率約2%-6%。男女皆會罹患，部分流行病學調查顯示男性盛行率較高，但臨床樣本以女性為主。年紀較大成人(55-94歲)儲物症狀幾乎是年輕成人(34-44歲)的三倍。",
  course:"始於生命早期並拓展至晚期：症狀可能首次出現在11-15歲，20幾歲中期開始影響每日生活，30幾歲中期造成臨床顯著損害；臨床研究參與者通常50幾歲。嚴重度隨每十年增加。一旦開始病程常慢性，少數個案起伏。兒童病態性儲物須與發展性適應性儲蓄搜集區分（考量第三方介入如父母維持環境可用而減少困擾的可能性）。",
  risk:"氣質：猶豫不決是患者及一等親的顯著特質。環境：發病或惡化前常可回溯性報告壓力創傷性生活事件。基因和生理：家族性，約50%患者報告親戚也有儲物；雙胞胎研究顯示變異性約50%因額外基因因素。",
  culture:"大部分研究於西方工業化國家城市社區，但非西方發展中國家資料顯示儲物是廣泛通用現象，臨床特質一致。",
  gender:"關鍵特質(難於丟棄、過量凌亂)男女皆顯著，但女性較男性傾向更多過度獲得(特別過度購物)。",
  functional:"凌亂損害基本活動(走動烹飪清理衛生睡眠)；器具可能毀損水電中斷；生活品質嚴重受損；嚴重案例置於火災跌倒(尤老年)衛生風險。與職業損害、較差身體健康、高度社會服務耗用有關；家庭關係緊繃，常涉及法律驅逐訴訟。",
  ddx:[
    ["其他身體病況","若判定為另一身體病況直接後果(創傷性腦傷、腫瘤手術切除、腦血管疾病、中樞神經感染、小胖威利症候群)不診斷儲物症；腹內側前額葉/扣帶迴皮質受傷與過度囤積特別相關，儲物行為在腦傷後迅速出現(非之前)。"],
    ["神經發展障礙症","若判定為神經發展障礙症(自閉症類群障礙症/智能不足)直接後果不診斷儲物症。"],
    ["思覺失調類型和其他精神病症","若判定為妄想或負性症狀直接後果不診斷儲物症。"],
    ["重度憂鬱發作","若判定為精神運動性遲滯/疲勞/失去活力直接後果不診斷儲物症。"],
    ["強迫症","<b>核心鑑別</b>：若判定為典型強迫思考行為直接後果(害怕污染受傷或不完整)不診斷儲物症。OCD囤積者行為通常非意願且痛苦，無法體驗愉悅回饋，過度擁有不常見(若有則因特定強迫思考而非真誠渴望擁有)，更可能囤積怪異物品(垃圾糞便尿指甲頭髮腐爛食物——這在儲物症上非常罕見)。若嚴重儲物與OCD症狀同時出現但判定為互相獨立，兩診斷可能都要給予。"],
    ["認知類障礙症","若判定為退化性疾病(額顳葉退化/阿茲海默病)直接後果不診斷儲物症；囤積起始通常漸進且在認知障礙症發病之後，可能伴隨自我忽略嚴重居家髒亂及其他神經精神症狀(去抑制化/賭博/儀式化刻板行為/抽搐/自傷)。"]
  ],
  comorbid:"約75%共病情緒或焦慮障礙症；最常見重度憂鬱症(高達50%)、社交焦慮症、GAD。約20%也符合OCD診斷準則症狀；這些共病可能是尋求諮詢的主要原因(患者較不喜歡主動提儲物症狀)。"
},
{
  id:"trich", name:"拔毛症", en:"Trichotillomania (Hair-Pulling Disorder)", code:"312.39 (F63.3)",
  criteria:[
    "A. 一再地拔毛髮導致毛髮量減少。",
    "B. 重複企圖減少或停止拔毛髮。",
    "C. 因拔毛髮引起臨床上顯著苦惱或在社交、職業或其他重要領域功能減損。",
    "D. 拔毛髮或掉毛髮無法歸因於另一身體病況所致（皮膚的狀況）。",
    "E. 拔毛髮無法以另一精神疾病的症狀做更好的解釋（身體臆形症中企圖改善外表缺陷）。"
  ],
  features:"核心是反覆地拔掉自己的毛髮，最常見頭皮眉毛眼瞼，較少見腋下臉部陰部肛門周圍；拔毛區域可能隨時間改變。可能短暫發作分散一天，或較不頻繁但持久持續數小時；可能持續數月數年。準則A要求導致髮量減少（可能分散模式拔除使減少不明顯，或企圖遮蓋掩飾落髮）。反覆嘗試減少停止拔毛（準則B）。苦惱一詞含失控難為情羞恥等負面情緒；損害可發生於數個功能領域。",
  assoc:"可能伴隨毛髮相關行為儀式（尋找特殊質地顏色毛髮、特殊方式拔除、拔出後檢視玩弄、在牙齒間拉扯咬碎吞食毛髮）。可能被焦慮或無聊誘發，緊張感增加後發生，拔出後導致滿足愉悅紓緩。意識程度不同（集中注意/自動化行為，許多混合兩種模式）。落髮模式差異大（完全禿髮或稀薄區域皆常見；「禿斑拔毛症」保留頭皮外圍狹小邊界，尤頸背區域）。通常不在旁人在場時發生(除很親密家人)；有些拔他人/寵物/玩偶/纖維物品毛髮；大部分也有其他針對身體重複行為（咬指甲咬嘴唇）。",
  prevalence:"一般大眾成人青少年12個月盛行率約1%-2%。女性比男性多，約<b>10:1</b>（可能反映實際性別比例，也可能反映性別文化態度造成求醫行為差異）。兒童患者男女較均等。",
  course:"也可見於嬰兒（通常早期發展階段緩解）。最常在青春期開始時或之後併發。拔髮位置可能隨時間變化。病程通常慢性，未治療也可能起伏；女性症狀可能伴隨賀爾蒙變化惡化(月經更年期)。少數個體發病數年內緩解無復發。",
  risk:"基因和生理：有基因易感性證據，較容易發生在OCD個體或其一等親上。",
  culture:"不同文化間表現相似，雖非西方區域數據不足。",
  ddx:[
    ["正常的毛髮移除/操弄","純粹因美觀理由不診斷拔毛症；扭轉玩弄毛髮通常不符合診斷；咬毛髮而非拔除也不符合。"],
    ["其他強迫症及相關障礙症","OCD關注對稱性個體拔毛可能是對稱性儀式一部分；BDD個體移除認為難看不對稱毛髮——這些皆不診斷拔毛症。符合拔毛症診斷者不列入其他特定強迫症及相關障礙症(針對身體重複行為障礙症)診斷。"],
    ["認知類障礙症","拔毛可能符合刻板化行為定義(重複動作障礙症)；抽搐症上的抽搐很少導致拔毛。"],
    ["精神病症","對妄想或幻聽反應而拔毛不診斷拔毛症。"],
    ["另一身體病況","皮膚發炎等其他皮膚病況所致拔毛/落髮不診斷拔毛症；須考量疤痕性禿髮(圓禿/雄性禿/休止期落髮)及非疤痕性禿髮等原因；皮膚切片或皮膚鏡可鑑別。"],
    ["物質相關障礙症","症狀可能因特定物質(興奮劑)惡化，但物質較不可能是持續拔毛的主要原因。"]
  ],
  comorbid:"最常見重度憂鬱症和摳皮症。大部分患者也有其他非拔毛非摳皮的針對身體重複行為(咬指甲)，可能需額外診斷其他特定強迫症及相關障礙症(針對身體的重複行為障礙症)。"
},
{
  id:"excor", name:"摳皮症", en:"Excoriation (Skin-Picking) Disorder", code:"698.4 (F42.4)",
  criteria:[
    "A. 一再地摳皮膚造成皮膚損傷。",
    "B. 重複企圖減少或停止摳皮膚。",
    "C. 因摳皮膚引起臨床上顯著苦惱或在社交、職業或其他重要領域功能減損。",
    "D. 摳皮膚無法歸因於某物質（古柯鹼）帶來的生理效應或另一身體病況（疥瘡）所致。",
    "E. 摳皮膚無法以另一精神疾病的症狀做更好的解釋（精神病症的妄想或觸幻覺、身體臆形症改善外表瑕疵、重複動作障礙症的重複行為、非自殺性自傷企圖傷害自己）。"
  ],
  features:"核心是反覆地摳自己的皮膚，最常見位置臉、手臂、手，但可能多處摳皮；可能摳健康皮膚、小皺摺、病灶(疙瘩繭)或先前摳皮造成的痂。大部分用指甲，也有用鑷子別針等器具；可能有摩皮擠壓切割囓咬。花大量時間(有時每日數小時)，持續數月數年。準則A要求導致皮膚病灶(即使常企圖遮蓋掩飾)。反覆嘗試減少停止(準則B)。苦惱含失控難為情羞恥等負面情緒。",
  assoc:"可能伴隨皮膚或痂有關行為儀式（找尋特別樣式的痂、檢視玩弄、口含吞下）。可能被焦慮無聊誘發，緊張後發生，摳下後導致滿足愉悅紓緩；有些反應皮膚不平整皺摺或不舒服身體感覺。意識程度不同(專注/自動化，混合模式常見)。通常不在旁人在場時發生(除很親密家人)；有些會摳他人的皮。",
  prevalence:"一般大眾成人終身盛行率1.4%或更高。四分之三或更多患者是女性（可能反映實際比例或求醫行為差異）。",
  course:"可能在各種年齡表現，最常初發於青少年時（通常在青春期開始同時或隨後）。常起始於皮膚病況(如痤瘡)。摳皮位置可能隨時間改變。病程常慢性，未治療可能起伏。",
  risk:"基因和生理：較容易發生在OCD個體或其一等親上（相較於一般大眾）。",
  functional:"與苦惱及社交職業功能受損有關。大部分每天花至少1小時摳皮/思考摳皮/抗拒摳皮。報告迴避社交娛樂活動及公共場所；工作/學業被干擾、曠課學習困難。身體併發症含組織壞損結痂感染(可能危及生命，罕見手腕滑膜炎)；感染通常需抗生素治療，有時需手術。",
  ddx:[
    ["精神病症","對妄想(寄生蟲妄想)或觸幻覺(蟻爬感)反應而摳皮不診斷摳皮症。"],
    ["其他特定的強迫症及相關障礙症","OCD對污染強迫思考回應而過度強迫性清洗可能造成病灶；BDD摳皮僅因外觀考量——這些皆不診斷摳皮症。其他特定強迫症及相關障礙症中的針對身體重複行為障礙症描述，應排除符合摳皮症診斷標準者。"],
    ["神經發展障礙症","重複行為障礙症起始於發展階段早期(小胖威利症可能有早發摳皮符合重複行為障礙症)；妥瑞氏症抽搐可能導致自傷，但摳皮症行為較不似抽搐。"],
    ["身體症狀及相關障礙症","若皮膚病灶主要因人為障礙症的欺騙行為不診斷摳皮症。"],

const tabbar = document.getElementById('tabbar');
const content = document.getElementById('content');
disorders.forEach((d,i)=>{
  const btn=document.createElement('button');
  btn.textContent=d.name;
  btn.onclick=()=>show(i);
  btn.id='tab-'+d.id;
  tabbar.appendChild(btn);
});
const compareBtn=document.createElement('button');
compareBtn.textContent='★ 綜合比較表';
compareBtn.id='tab-compare';
compareBtn.onclick=()=>showCompare();
tabbar.appendChild(compareBtn);

function fieldBlock(title,text){
  if(!text) return '';
  return `<h3>${title}</h3><div>${text}</div>`;
}
function ddxBlock(list){
  if(!list) return '';
  let html = '<h3>鑑別診斷 (Differential Diagnosis) ★</h3>';
  list.forEach(([name,text])=>{
    html += `<div class="ddx-item"><b>${name}：</b>${text}</div>`;
  });
  return html;
}

function renderDisorder(d){
  let html = `<h2 class="dx-title">${d.name} <span class="small">${d.en}</span></h2>`;
  html += `<div class="code">診斷碼：${d.code}</div>`;
  html += `<h3>診斷準則 (Diagnostic Criteria) ★★</h3>`;
  html += `<div class="crit-box"><ul>${d.criteria.map(c=>`<li>${c}</li>`).join('')}</ul></div>`;
  if(d.specifiers){
    html += `<h3>特別註明 (Specifiers)</h3><div class="note"><ul>${d.specifiers.map(s=>`<li>${s}</li>`).join('')}</ul></div>`;
  }
  html += fieldBlock('診斷特質 (Diagnostic Features)', d.features);
  html += fieldBlock('支持診斷相關特質 (Associated Features)', d.assoc);
  html += fieldBlock('盛行率 (Prevalence)', d.prevalence);
  html += fieldBlock('發展和病程 (Development and Course)', d.course);
  html += fieldBlock('風險和預後因子 (Risk and Prognostic Factors)', d.risk);
  html += fieldBlock('性別相關診斷議題 (Gender-Related)', d.gender);
  html += fieldBlock('文化相關診斷議題 (Culture-Related)', d.culture);
  html += fieldBlock('自殺風險 (Suicide Risk)', d.suicide);
  html += fieldBlock('功能性後果 (Functional Consequences)', d.functional);
  html += ddxBlock(d.ddx);
  html += fieldBlock('共病 (Comorbidity)', d.comorbid);
  return html;
}

function show(i){
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+disorders[i].id).classList.add('active');
  const section=document.createElement('section');
  section.className='active';
  section.innerHTML = renderDisorder(disorders[i]);
  content.innerHTML='';
  content.appendChild(section);
  window.scrollTo({top:0,behavior:'smooth'});
}

  <div class="ddx-item"><b>拔毛症/摳皮症 vs. OCD：</b>拔毛症和摳皮症的重複行為<span class="compare-highlight">並非由強迫思考或執著促發</span>（準則E明確排除OCD更好解釋的情況），可能跟隨焦慮無聊等情緒狀態、緊張感增加、行為後有滿足愉悅感；OCD的強迫行為則是<b>對強迫思考的回應</b>，且並非為了愉悅而做。</div>
  <div class="ddx-item"><b>拔毛症/摳皮症 vs. 身體臆形症的關鍵時間軸區分：</b>「病識感」貫穿全章5大核心疾病的共同分類架構——OCD、BDD、儲物症皆有<b>良好/差/沒有病識感(具妄想意念)</b>三級特別註明；病識感差通常與<b>較差預後</b>相關。</div>
  <div class="ddx-item"><b>另一身體病況引起 vs. 物質/醫藥引發：</b>核心鑑別在<span class="compare-highlight">病因來源</span>——前者是身體病況本身的<b>直接病理生理後果</b>(如紋狀體損傷、西德納姆舞蹈症)；後者是<b>物質中毒/戒斷或藥物使用</b>的直接效應，症狀時序與物質使用/停用一致（治療中止後數天至一個月內應改善）。若證據不足判定何者，或判定為原發性但發病年齡晚/症狀不典型，可下「其他特定或非特定的強迫症及相關障礙症」。</div>
  <div class="ddx-item"><b>PANDAS/西德納姆舞蹈症：</b>兩者皆與<span class="compare-highlight">Group A鏈球菌感染</span>相關，但西德納姆舞蹈症有明確運動特徵(舞蹈症)及風濕熱其他系統症狀(心臟炎關節炎)；PANDAS則是<b>突發性強迫思考行為和/或抽搐</b>，無舞蹈症心臟炎關節炎，是較具爭議的診斷實體(現多以更廣泛的PANS/CANS描述)。</div>

  <h3>本章共同主軸（整章導言重點）</h3>
  <ul>
  <li>本章疾病依<span class="compare-highlight">核心症狀類型</span>可分三組排列：①<b>OCD</b>(強迫思考+強迫行為) ②<b>身體臆形症、儲物症</b>(以認知症狀/執著為特徵——分別是外觀瑕疵執著、保存所有物需求) ③<b>拔毛症、摳皮症</b>(以反覆聚焦身體的重複行為為特徵，不由強迫思考驅動)。這樣的排列順序反映了疾病間的現象學光譜關係。</li>
  <li>強迫症及相關障礙症與正常發展的執著和儀式的不同之處，在於<span class="compare-highlight">超過了對發展階段而言適切的過度或持久</span>；亞臨床症狀和臨床疾病的區別需評估<b>苦惱程度和功能減損程度</b>。</li>
  <li>本章疾病有<span class="compare-highlight">認知組成成分</span>，以<b>病識感</b>為特別註明基礎（良好或尚可／差／沒有病識感/具妄想意念）——OCD、BDD、儲物症皆有此特別註明。<b>重要原則：即使被附註為「沒有病識感/具妄想意念」，這些疾病症狀也不應被診斷為精神病</b>（與妄想症/思覺失調症有本質區別）。</li>
  <li>拔毛症與摳皮症的重複行為<span class="compare-highlight">並非因強迫思考或執著促發</span>，但可能跟隨或伴隨各種情緒狀態(焦慮/無聊)，也可能跟隨緊張感增加，並在行為後導致滿足愉悅舒緩感——這是與OCD強迫行為的根本差異(OCD強迫行為並非因快樂而做)。</li>
  <li>拔毛症與摳皮症患者對行為的<span class="compare-highlight">意識覺察程度不同</span>：部分呈現更多注意力於行為本身(行為前高張力，行為後舒緩)，部分表現更像自動化行為(注意力不完整時發生)，許多患者兩種模式混合出現。</li>
  <li>物質/醫藥引發、另一身體病況引起兩個「病因學」類別，以及其他特定/非特定類別，構成本章的<span class="compare-highlight">共同收尾架構</span>，與其他DSM-5章節的組織邏輯一致；其他特定類別特別收錄了未正式列入第二篇的相關症候群（類身體臆形症變異型、專注身體的重複行為障礙症、強迫性嫉妒，以及數個跨文化症候群如shubo-kyofu、koro、jikoshu-kyofu）。</li>
  </ul>
